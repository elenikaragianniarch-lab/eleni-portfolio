<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eleni Karagianni</title>
<meta name="description" content="Eleni Karagianni: architectural engineer and computational designer in London. AI agents, data pipelines and 3D systems that read cities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Roboto+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a working index, like a film studio's directory. Black on white, one wide heavy face for names, a typewriter face for everything else.
   Deliberately single-theme (black and white print look), so colours are set explicitly. */
:root{
  --paper:#FFFFFF; --ink:#111111; --muted:#5A5A5A; --rule:#111111; --hair:#D4D4D4; --tint:#F3F3F1; --dot:#111111;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:300 14px/1.6 var(--f-mono);-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab{font-weight:500;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;margin:0 0 14px}
.b{font-weight:500}
.up{text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)}
hr{border:0;border-top:1.5px solid var(--rule);margin:0}
p{margin:0}

/* header */
header.top{padding-block:22px 0}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1.5px solid var(--rule)}
.bar a{text-decoration:none}
.bar .home{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.01em;text-transform:uppercase}
.bar nav{display:flex;gap:18px;font-size:13px}
.bar nav a:hover{text-decoration:underline;text-underline-offset:4px}

/* hero */
.hero{padding-block:44px 36px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;align-items:end}
.name{font-family:var(--f-display);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(40px,8.4vw,104px);line-height:.92;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lede{font-size:clamp(16px,1.7vw,19px);line-height:1.5;max-width:40ch;margin-top:26px;text-wrap:pretty}
.side p{font-size:13px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* index */
.works{padding-block:30px 40px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{text-decoration:none;display:grid;gap:9px;min-width:0}
.thumb{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--tint);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.thumb img.col{opacity:0}
.card:hover .thumb img.col,.card:focus-visible .thumb img.col{opacity:1}
.thumb.dots{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:9px 9px}
.thumb.dots span{position:absolute;left:10px;bottom:8px;background:var(--paper);font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:22px;line-height:1;padding:4px 6px}
.cap{font-size:12.5px;line-height:1.45}
.cap .t{font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.card:hover .cap .t{text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;color:var(--muted)}

/* list strip under index */
.stack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;padding-block:28px 40px}
@media (max-width:760px){.stack{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack p{font-size:13px}

/* project page */
.proj{padding-block:28px 60px}
.back{font-size:13px;text-decoration:none;display:inline-block;margin-bottom:22px}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.ptitle{font-family:var(--f-display);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(30px,5.6vw,66px);line-height:.95;margin:6px 0 0;text-wrap:balance}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;font-size:13px}
.plede{font-size:clamp(16px,1.6vw,19px);line-height:1.5;max-width:52ch;margin-top:22px;text-wrap:pretty}
.builders{margin-top:30px;border:1.5px solid var(--rule);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.builders>div{padding:16px 18px;border-right:1px solid var(--hair);min-width:0}
.builders>div:last-child{border-right:0}
.builders .lab{margin-bottom:8px;text-decoration:none;font-size:11.5px}
.builders p,.builders li{font-size:13px}
.builders ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
@media (max-width:860px){.builders{grid-template-columns:repeat(2,minmax(0,1fr))}.builders>div:nth-child(2){border-right:0}.builders>div:nth-child(-n+2){border-bottom:1px solid var(--hair)}}
@media (max-width:480px){.builders{grid-template-columns:1fr}.builders>div{border-right:0;border-bottom:1px solid var(--hair)}.builders>div:last-child{border-bottom:0}}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;font:500 12.5px var(--f-mono);text-decoration:none;border:1.5px solid var(--ink);padding:6px 11px;background:var(--ink);color:var(--paper);letter-spacing:.02em}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:hover{background:var(--paper);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.off{border-style:dashed;background:var(--paper);color:var(--muted);cursor:default}
.hero-img{margin:34px 0 0}
.hero-img img{width:100%;display:block;max-height:640px;object-fit:cover}
.hero-img figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.sec{margin-top:46px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
@media (max-width:760px){.sec{grid-template-columns:1fr;gap:6px}}
.sec .body{max-width:70ch;min-width:0}
.sec .body p+p{margin-top:12px}
.sec ul.pts{margin:0;padding-left:18px;display:grid;gap:8px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;border-top:1px solid var(--hair);padding-top:16px}
.nums b{display:block;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:12.5px;color:var(--muted)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr) auto);grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:stretch}
.pipe .step{border:1.5px solid var(--ink);padding:10px 12px;font-size:12.5px;min-width:0}
.pipe .step b{display:block;font-weight:500;text-transform:uppercase;letter-spacing:.02em;font-size:11.5px;margin-bottom:3px}
.pipe .arr{align-self:center;padding:0 6px;font-weight:500}
@media (max-width:760px){.pipe{display:flex;flex-direction:column}.pipe .arr{transform:rotate(90deg);align-self:flex-start;padding:2px 14px}}

/* findings chart */
.chart{display:grid;gap:14px}
.metric .mh{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;margin-bottom:5px}
.metric .row{display:grid;grid-template-columns:62px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:12px}
.metric .track{height:12px;background:var(--tint);position:relative}
.metric .fill{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.metric .fill.norm{background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px)}
.metric .v{text-align:right;font-variant-numeric:tabular-nums}

/* agents */
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.agents div{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 14px;font-size:12.5px;min-width:0}
.agents div b{display:block;font-weight:500;text-transform:uppercase;font-size:12px;letter-spacing:.02em}
@media (max-width:640px){.agents{grid-template-columns:1fr}}

/* contradiction path */
.path{display:grid;gap:0}
.node{display:grid;grid-template-columns:44px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px}
.node:first-child{border-top:1px solid var(--hair)}
.node .i{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:18px}
.node .sc{display:grid;gap:3px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.node .bar2{height:6px;background:var(--tint);position:relative}
.node .bar2 i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.quote{font-size:clamp(17px,2vw,22px);line-height:1.45;border-left:3px solid var(--ink);padding:4px 0 4px 18px;max-width:46ch}

/* words */
.seq{display:flex;flex-wrap:wrap;gap:6px}
.seq span{border:1.5px solid var(--ink);padding:3px 8px;font-size:12.5px}
.seq span.on{background:var(--ink);color:var(--paper)}
.behav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.behav div{border-top:1.5px solid var(--ink);padding-top:8px;font-size:12.5px}
@media (max-width:560px){.behav{grid-template-columns:1fr}}

/* about */
.about{padding-block:40px 30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:28px}
@media (max-width:860px){.about{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.about{grid-template-columns:1fr}}
.about .item{margin-bottom:12px;font-size:13px}
.about .intro{font-size:15px;line-height:1.6;grid-column:1/-1;max-width:62ch}
.contact{padding-block:30px 60px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
@media (max-width:640px){.contact{grid-template-columns:1fr}}
.contact .big{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(20px,3.6vw,40px);line-height:1.05;text-transform:uppercase;user-select:all;overflow-wrap:anywhere}
.copy{font:500 12.5px var(--f-mono);border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 11px;cursor:pointer}
footer{padding-block:18px 30px;font-size:12px;color:var(--muted);border-top:1.5px solid var(--rule)}

/* intro */
.opener{padding-block:46px 40px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:36px;align-items:end}
@media (max-width:820px){.opener{grid-template-columns:1fr}}
.claim{font-family:var(--f-display);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(34px,5.6vw,76px);line-height:.95;letter-spacing:-.01em;margin:0;text-wrap:balance}
.intro-side p{font-size:14px}
/* featured: inverted band */
.feature{background:var(--ink);color:var(--paper);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.f-in{padding-block:40px 44px;display:grid;gap:28px}
.f-k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;opacity:.8}
.f-k.dark{opacity:1;color:var(--muted)}
.f-t{font-family:var(--f-display);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(30px,5vw,64px);line-height:.95;margin:8px 0 0;text-wrap:balance}
.f-l{font-size:clamp(15px,1.5vw,18px);line-height:1.5;max-width:56ch;margin-top:16px}
.f-live{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.f-live{grid-template-columns:1fr}}
.lv{border:1.5px solid var(--paper);background:var(--ink);min-width:0;display:flex;flex-direction:column}
.lv-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1.5px solid var(--paper);font-size:12px}
.lv-bar a{margin-left:auto;text-decoration:none}
.lv-dot{width:8px;height:8px;border-radius:50%;background:#3BD16F;box-shadow:0 0 0 3px rgba(59,209,111,.25)}
.lv-url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv iframe{width:100%;height:380px;border:0;background:#fff;display:block}
.lv-prev{position:relative;display:grid;place-items:center;height:300px;text-decoration:none;background-color:var(--ink);background-image:radial-gradient(rgba(255,255,255,.55) 1.3px,transparent 1.5px);background-size:10px 10px;overflow:hidden}
.lv-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lv-go{position:relative;background:var(--paper);color:var(--ink);font-weight:500;font-size:13px;padding:9px 14px;border:1.5px solid var(--paper)}
.lv-prev:hover .lv-go{background:var(--ink);color:var(--paper)}
.lv-cap{padding:12px 12px 14px;font-size:13px;border-top:1.5px solid var(--paper)}
.f-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;border-top:1px solid rgba(255,255,255,.35);padding-top:18px}
@media (max-width:640px){.f-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f-nums b{display:block;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:28px;line-height:1}
.f-nums span{font-size:12.5px;opacity:.8}
.btn.inv{background:var(--paper);color:var(--ink);border-color:var(--paper);justify-self:start}
.btn.inv:hover{background:var(--ink);color:var(--paper)}
/* pair */
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding-block:40px}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
.big-card{text-decoration:none;border:1.5px solid var(--ink);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.big-card:hover .more{text-decoration:underline;text-underline-offset:4px}
.bc-img{aspect-ratio:16/10;overflow:hidden;margin:-18px -18px 6px;border-bottom:1.5px solid var(--ink)}
.bc-img img{width:100%;height:100%;object-fit:cover;display:block}
.bc-t{font-family:var(--f-display);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(22px,2.6vw,32px);line-height:1;margin:0}
.big-card p{font-size:13.5px}
.big-card .pull{font-size:clamp(18px,2vw,24px);line-height:1.35;border-left:3px solid var(--ink);padding-left:14px;margin-block:8px}
.big-card.text{background-image:radial-gradient(var(--hair) 1.2px,transparent 1.4px);background-size:10px 10px}
.big-card.text>*{background:var(--paper)}
.more{margin-top:auto;font-weight:500;font-size:13px}
/* directory list */
.also{padding-block:6px 30px}
.dir{border-top:1.5px solid var(--ink)}
.dir-row{display:grid;grid-template-columns:64px 44px minmax(0,1.3fr) minmax(0,1fr) 80px;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);text-decoration:none;font-size:13.5px;align-items:baseline}
.dir-row:hover{background:var(--tint)}
.dn{color:var(--muted)} .dt{font-weight:500;text-transform:uppercase;letter-spacing:.02em} .dk{color:var(--muted)} .dy{text-align:right}
@media (max-width:560px){.dir-row{grid-template-columns:56px 36px minmax(0,1fr) 56px}.dk{display:none}}

.ht{position:relative;overflow:hidden}
.ht img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.ht img.col{opacity:0}
.big-card:hover .ht img.col,.f-img:hover img.col,.f-img:focus-visible img.col,.dir-row:hover .thumb img.col{opacity:1}
.f-top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:end}
@media (max-width:760px){.f-top{grid-template-columns:1fr}}
.f-img{display:block;aspect-ratio:1/1;max-width:100%;border:1.5px solid var(--paper)}
.dthumb .thumb{width:64px}
.dthumb .thumb.dots span{font-size:11px;left:4px;bottom:4px;padding:2px 3px}
@media (max-width:560px){.dthumb .thumb{width:56px}}

.demos{border-top:1.5px solid var(--ink)}
.demo{display:grid;grid-template-columns:40px minmax(0,1fr) 84px;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair);text-decoration:none;font-size:13px;align-items:baseline}
.demo:hover{background:var(--tint)}
.demo .dn{color:var(--muted)} .demo .go{text-align:right;font-weight:500}
.f-more{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;align-items:baseline}
.f-more span{opacity:.75}
.f-more a{text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.thumb img,.ht img{transition:none}}


/* ===== v2: moving index, fixed frame, red accent ===== */
:root{--red:#E3241B;--f-serif:"Instrument Serif",Georgia,"Times New Roman",serif}
body{overflow-x:hidden}
.wrap{max-width:none}
::selection{background:var(--red);color:#fff}
a:hover{color:inherit}

/* fixed frame */
.frame-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;padding-block:16px 12px;font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--paper)}
.frame-top .disc{color:var(--ink)}
.frame-top nav{display:flex;gap:6px}
.frame-top nav a{text-decoration:none;color:var(--muted)}
.frame-top nav a.on{color:var(--ink)}
.frame-top nav a:hover{color:var(--red)}
.frame-top nav span{color:var(--muted)}
.frame-top .msg{justify-self:end;text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:2px}
.frame-top .msg:hover{color:var(--red);border-color:var(--red)}
@media (max-width:640px){.frame-top{grid-template-columns:1fr auto}.frame-top .disc{display:none}}

/* stage (home) */
.stage{position:relative;min-height:calc(100svh - 60px);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto auto;overflow:hidden}
.stage>*{min-width:0}
.strip-wrap{overflow:visible}
#dots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.strip-wrap{position:relative;z-index:1;display:flex;align-items:center;min-height:430px;padding-block:24px}
.strip{display:flex;align-items:flex-start;gap:0;transition:transform .7s cubic-bezier(.2,.8,.2,1);will-change:transform}
.it{flex:0 0 auto;width:150px;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;gap:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.it .cap2{font-size:12px;line-height:1.35;padding-right:10px;height:76px;overflow:hidden}
.it .cap2 .num{display:block;margin-bottom:8px}
.it .cap2 .tt{display:block;font-weight:500}
.it .cap2 .kk{display:block;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.03em}
.it .pic{position:relative;width:100%;height:150px;overflow:hidden;background:var(--tint);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.it .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s ease}
.it .pic img.col{opacity:0}
.it .pic.dots{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:9px 9px}
.it.on{width:360px}
.it.on .pic{height:440px}
.it.on .pic img.col{opacity:1}
.it.on .cap2 .num,.it.on .cap2 .tt{color:var(--red)}
.it:not(.on):hover .pic img.col{opacity:1}
.it:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.it .open-hint{display:none;font-size:12px;font-weight:500;color:var(--red)}
.it.on .open-hint{display:block}
@media (max-width:640px){.it{width:110px}.it .pic{height:110px}.it.on{width:250px}.it.on .pic{height:310px}.strip-wrap{min-height:380px}}

.stage-foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;padding-bottom:4px}
.toggle button{font:inherit;background:none;border:0;padding:0;cursor:pointer;color:var(--muted)}
.toggle button.on{color:var(--ink)}
.toggle button:hover{color:var(--red)}
.ctrl{display:flex;gap:6px}

let mx=-999,my=-999,raf=0;
function drawDots(){
  const c=$("#dots"); if(!c)return; const r=c.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
  if(c.width!==Math.round(r.width*dpr)){c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr)}
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);g.fillStyle="#D4D4D4";
  const step=18;for(let y=step/2;y<r.height;y+=step)for(let x=step/2;x<r.width;x+=step){const d=Math.hypot(x-mx,y-my);const s=d<160?1+3.2*(1-d/160):1;g.fillStyle=d<160?"rgba(227,36,27,"+(0.25+0.6*(1-d/160)).toFixed(2)+")":"#DADADA";g.beginPath();g.arc(x,y,s,0,6.283);g.fill()}
  raf=0;
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="about"||h==="contact"){ if(!$("#view").innerHTML){renderView(lastView)} openPanel(h); return }
  closePanel(); renderView(h);
}
function renderView(h){
  lastView=h;
  const p=P.find(x=>x.id===h);
  document.querySelectorAll(".frame-top nav a").forEach(a=>a.classList.toggle("on",(a.getAttribute("href")==="#lab"&&h==="lab")||(a.getAttribute("href")==="#"&&!p&&h!=="lab")));
  $("#view").innerHTML=p?projectV(p):h==="lab"?lab():stage();
  document.title=p?`${p.t} · Eleni Karagianni`:h==="lab"?"Lab · Eleni Karagianni":"Eleni Karagianni";
  k=1;drawSeq();tickClock();window.scrollTo(0,0);
  if(!p&&h!=="lab"){ if(mode==="carousel"){requestAnimationFrame(()=>setActive(active,true))} queueDots() }
}
document.addEventListener("click",async e=>{
  const it=e.target.closest(".it");
  if(it){const i=+it.dataset.i;if(i!==active){e.preventDefault();setActive(i)}return}
  const md=e.target.closest("[data-mode]");if(md){mode=md.dataset.mode;try{localStorage.setItem("mode",mode)}catch(err){}renderView("");return}
  if(e.target.id==="prev"){setActive(active-1);return}
  if(e.target.id==="nxt"){setActive(active+1);return}
  const lc=e.target.closest("[data-lab]");if(lc){const c=LAB[+lc.dataset.lab];if(c.ext){window.open(c.u,"_blank","noopener")}else theatre(c.t,c.u);return}
  const th=e.target.closest("[data-theatre]");if(th){e.preventDefault();theatre(th.dataset.theatre,th.href);return}
  const dm=e.target.closest("a.demo");if(dm&&/vercel\.app|drive\.google/.test(dm.href)){e.preventDefault();theatre(dm.querySelector(".b")?.textContent||"Demo",dm.href);return}
  if(e.target.closest("[data-close]")||e.target.id==="scrim"){closePanel();history.replaceState(null,"",lastView?"#"+lastView:location.pathname);return}
  if(e.target.id==="th-close"){closeTheatre();return}
  if(e.target.id==="seqnext"){k=Math.min(WORDS.length,k+1);drawSeq()}
  if(e.target.id==="seqreset"){k=1;drawSeq()}
  if(e.target.id==="copymail"){const b=e.target;try{await navigator.clipboard.writeText($("#mail").textContent);b.textContent="Copied"}catch(err){const r=document.createRange();r.selectNodeContents($("#mail"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected"}setTimeout(()=>b.textContent="Copy email",1800)}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#theatre").classList.contains("on"))closeTheatre();else if($("#panel").classList.contains("on")){closePanel();history.replaceState(null,"",lastView?"#"+lastView:location.pathname)}}
  if(!$("#strip")||$("#panel").classList.contains("on")||$("#theatre").classList.contains("on"))return;
  if(e.key==="ArrowRight"){setActive(active+1)}if(e.key==="ArrowLeft"){setActive(active-1)}
});
let wheelLock=0;
document.addEventListener("wheel",e=>{
  if(!$("#strip")||$("#panel").classList.contains("on"))return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(Math.abs(d)<12)return; const now=Date.now(); if(now-wheelLock<450)return; wheelLock=now;
  setActive(active+(d>0?1:-1));
},{passive:true});
let tx=null;
document.addEventListener("touchstart",e=>{if($("#strip"))tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null||!$("#strip"))return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)setActive(active+(dx<0?1:-1))},{passive:true});
document.addEventListener("pointermove",e=>{const c=$("#dots");if(!c)return;const r=c.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;queueDots()});
addEventListener("resize",()=>{center();queueDots()});
window.addEventListener("hashchange",route);
route();

</script>
</body>
</html>
